# Selected via config_file=/etc/postgresql/postgresql.conf; NO_TS_TUNE prevents autotuning.

listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'

# Single-host plaintext transport is pending owner acceptance.
# Remote or multi-host database connections require verified TLS.
ssl = off

shared_preload_libraries = 'timescaledb'
max_connections = 40
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
timescaledb.max_background_workers = 4
dynamic_shared_memory_type = posix

# Slow and error statements may log SQL text; bind parameters are omitted.
timescaledb.telemetry_level = off
log_statement = 'none'
log_min_duration_statement = 500ms
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = 'error'
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
