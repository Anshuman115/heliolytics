# Bounded PostgreSQL and TimescaleDB settings for one Heliolytics host.
#
# Mounted read-only at /etc/postgresql/postgresql.conf and selected with
# command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"].
# TimescaleDB autotune is disabled (NO_TS_TUNE) so nothing rewrites these values.

listen_addresses = '*'
port = 5432
unix_socket_directories = '/var/run/postgresql'
hba_file = '/etc/postgresql/pg_hba.conf'
password_encryption = 'scram-sha-256'

# Internal database network only. The owner accepts the plaintext transport risk
# for a single host; any remote or multi-host database requires TLS first.
ssl = off

shared_preload_libraries = 'timescaledb'
max_connections = 40
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 4MB
maintenance_work_mem = 128MB
max_worker_processes = 8
max_parallel_workers = 4
max_parallel_workers_per_gather = 2
timescaledb.max_background_workers = 4
dynamic_shared_memory_type = posix

# Telemetry off, no statement logging, no bind parameters in duration lines.
timescaledb.telemetry_level = off
log_statement = 'none'
log_min_duration_statement = 500ms
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_error_statement = 'error'
log_timezone = 'UTC'
timezone = 'UTC'
datestyle = 'iso, mdy'
