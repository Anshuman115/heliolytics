# Heliolytics cluster authentication. SCRAM only, explicit rejects, no trust or MD5.
#
# Local socket and loopback lines serve the container healthcheck and psql inside
# the database container. The 172.30.0.0/24 line serves API traffic on the data
# network and must stay in step with DATA_SUBNET in deploy/.env.

# TYPE  DATABASE  USER             ADDRESS         METHOD
local   all       heliolytics                     scram-sha-256
local   all       heliolytics_app                 scram-sha-256
host    all       heliolytics      127.0.0.1/32    scram-sha-256
host    all       heliolytics_app  127.0.0.1/32    scram-sha-256
host    all       heliolytics      ::1/128         scram-sha-256
host    all       heliolytics_app  ::1/128         scram-sha-256
host    all       heliolytics      172.30.0.0/24   scram-sha-256
host    all       heliolytics_app  172.30.0.0/24   scram-sha-256

# Reject tail. Anything not listed above is refused.
local   all       all                              reject
host    all       all              all             reject
